spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1522/FREEPDB1
    username: DOCFLOW_EXP
    password: docflow_exp
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8080

logging:
  level:
    root: INFO
    com.docflow: DEBUG   # enables your aspect debug logs
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.datasource.DataSourceUtils: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "loggers"]   # expose logger control
  endpoint:
    loggers:
      enabled: true

docflow:
  storage:
    type: filesystem
    filesystem:
      root: uploads
  auth:
    implicitMakerEnabled: true
  reports:
    documentTable:
      name: DOCUMENT_PARENT
      internalPk: ID
      businessKey: DOCUMENT_NUMBER
    metadataTable:
      name: DOCUMENT_METADATA
      documentIdColumn: DOCUMENT_ID
      keyColumn: FIELD_KEY
      valueColumn: FIELD_VALUE
      valueIsClob: true
      clobSelectLimit: 4000
    entities:
      - name: LOAN_DATA
        label: Loans
        type: RELATIONAL
        joinToDocument:
          enabled: true
          businessFkColumn: USER_ID
excel:
  target-table: loan_data
  primary-key: loan_no
  mappings:
    "LoanNo": "loan_no"
    "Amount": "amount"
    "Start Date": "start_date"
    "End Date": "end_date"
    "Monthly EMI": "monthly_emi"
    "Branch": "branch"
    "Total Installment": "total_installment"
    "User ID": "user_id"
