spring:
  datasource:
    url: jdbc:oracle:thin:@oracle-free:1521/FREEPDB1
    username: DOCFLOW_EXP
    password: DOCFLOW_EXP
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
server:
  port: 8080

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.docflow: ${LOGGING_LEVEL_COM_DOCFLOW:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_BINDER:INFO}
    org.springframework.jdbc.core: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE:INFO}
    org.springframework.jdbc.core.JdbcTemplate: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_TEMPLATE:INFO}
    org.springframework.jdbc.datasource.DataSourceUtils: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATASOURCE_UTILS:INFO}

management:
  endpoints:
    web:
      exposure:
        # Non-prod default includes logger control for operational troubleshooting.
        # For UAT/prod, remove "loggers"; recommended exposure is DOCFLOW_ACTUATOR_EXPOSURE=health,info.
        include: ${DOCFLOW_ACTUATOR_EXPOSURE:health,info,loggers}
  endpoint:
    loggers:
      enabled: true

docflow:
  storage:
    type: filesystem
    filesystem:
      root: uploads
  auth:
    implicitMakerEnabled: true
  reports:
    weekStartDay: MONDAY
    documentTable:
      name: DOCUMENT_PARENT
      internalPk: ID
      businessKey: DOCUMENT_NUMBER
    metadataTable:
      name: DOCUMENT_METADATA
      documentIdColumn: DOCUMENT_ID
      keyColumn: FIELD_KEY
      valueColumn: FIELD_VALUE
      valueIsClob: true
      clobSelectLimit: 4000
    entities:
      - name: LOAN_DATA
        label: Loans
        type: RELATIONAL
        joinToDocument:
          enabled: true
          documentFkColumn: CLIENT_ID
          businessFkColumn: USER_ID
  notification:
    enabled: true
    user-email-domain: company.internal
    document:
      reviewer-metadata-keys:
        - reviewer
        - reviewerId
        - reviewer_user_id
      approver-metadata-keys:
        - approver
        - approverId
        - approver_user_id
    outbox:
      processing-enabled: true
      batch-size: 20
      fixed-delay-ms: 30000
    mail:
      enabled: false
      adapter-priority:
        - SMTP
        - LOCALHOST_SMTP
        - MAILX
      from-address: noreply@company.internal
      reply-to: support@company.internal
      allowed-internal-domains:
        - company.internal
      max-to-count: 25
      max-cc-count: 10
      connection-timeout-ms: 5000
      read-timeout-ms: 5000
      write-timeout-ms: 5000
      smtp:
        host: localhost
        port: 2525
        auth: false
        start-tls: false
      localhost-relay:
        host: localhost
        port: 25
        auth: false
        start-tls: false
      mailx-command-path: mailx
excel:
  target-table: loan_data
  primary-key: loan_no
  mappings:
    "LoanNo": "loan_no"
    "Amount": "amount"
    "Start Date": "start_date"
    "End Date": "end_date"
    "Monthly EMI": "monthly_emi"
    "Branch": "branch"
    "Total Installment": "total_installment"
    "User ID": "user_id"


schema:
  bindingStrategy: ACTIVE_ONLY
